name: Aktualizacja danych i publikacja pulpitu
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coffee-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parsera i ochrony danych
        run: python -m unittest discover -s tests -v
      - name: Pobierz notowania i kursy NBP
        id: refresh
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Diagnostyka dostępności źródeł po błędzie
        if: steps.refresh.outcome == 'failure'
        run: |
          python - <<'PYTHON'
          import concurrent.futures, html, json, re
          from urllib.request import Request, urlopen
          urls = [
              'https://stooq.com/q/l/?s=kc.f&f=sd2t2ohlcv&h&e=csv',
              'https://stooq.com/q/l/?s=rc.f&f=sd2t2ohlcv&h&e=csv',
              'https://www.investing.com/commodities/london-coffee-historical-data',
              'https://www.barchart.com/futures/quotes/RM*0/overview',
              'https://www.barchart.com/futures/quotes/KC*0/overview',
          ]
          def probe(url):
              try:
                  request = Request(url, headers={'User-Agent': 'CoffeeMarketDashboard/1.0 (public daily quotations)'})
                  with urlopen(request, timeout=20) as response:
                      body = response.read(2_000_000).decode('utf-8', errors='replace')
                  title = re.search(r'<title[^>]*>(.*?)</title>', body, re.S)
                  if title:
                      sample = html.unescape(title[1]).strip()
                      matches = re.findall(r'.{0,120}(?:lastPrice|tradeTime|symbolName|quoteOverview|data-bc-quote).{0,300}', body)
                      sample += ' | ' + ' | '.join(matches[:6])
                  else:
                      sample = body[:1200]
                  message = url + ': ' + sample
              except Exception as exc:
                  message = url + ': ' + str(exc)
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Diagnostyka źródła::' + message)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              list(pool.map(probe, urls))
          PYTHON
      - name: Zapisz dane i historię w repozytorium
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja dziennych danych rynku kawy"
            git push
          fi
      - name: Zbuduj statyczną stronę
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/market.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Zgłoś niepełną aktualizację po publikacji ostatnich dobrych danych
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Źródło danych nie odpowiedziało poprawnie. Opublikowano ostatnie prawidłowe dane i komunikat o błędzie.'
          exit 1
